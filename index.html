function resolveTimes(){
  const clk=o=>{if(o&&isN(o.ago)){const d=agoDate(o.ago);o.date=ymd(d);o.time=pad(d.getHours())+':'+pad(d.getMinutes())}
      else if(o&&isN(o.dayAgo)){const d=new Date(NOW0.getFullYear(),NOW0.getMonth(),NOW0.getDate()-o.dayAgo);o.date=ymd(d);if(o.at){o.time=o.at;delete o.at}if(!o.time)o.time='12:00'}};
  try{
    ((P.kakao&&P.kakao.rooms)||[]).forEach(r=>(r.msgs||[]).forEach(clk));
    ((P.msgs&&P.msgs.threads)||[]).forEach(t=>(t.msgs||[]).forEach(clk));
    ((P.bubble&&P.bubble.msgs)||[]).forEach(m=>{if(isN(m.ago)){const d=agoDate(m.ago);m.date=ymd(d);m.time=pad(d.getHours())+':'+pad(d.getMinutes())}
      else if(isN(m.dayAgo)){const d=new Date(NOW0.getFullYear(),NOW0.getMonth(),NOW0.getDate()-m.dayAgo);m.date=ymd(d);if(m.at){m.time=m.at;delete m.at}}});
    const lbl=(o,suf)=>{if(o&&isN(o.ago))o.time=agoLbl(o.ago,suf)};
    ((P.x&&P.x.tweets)||[]).forEach(t=>{lbl(t);(t.replyList||[]).forEach(r=>lbl(r))});
    ((P.x&&P.x.dms)||[]).forEach(d=>(d.msgs||[]).forEach(m=>{if(isN(m.ago)){const x=agoDate(m.ago);m.time=pad(x.getHours())+':'+pad(x.getMinutes())}}));
    const ig=P.ig||{};(ig.posts||[]).concat(ig.feed||[]).forEach(p=>{lbl(p,'前');(p.comments||[]).forEach(c=>lbl(c,'前'))});
    (ig.followingList||[]).forEach(u=>(u.posts||[]).forEach(p=>{lbl(p,'前');(p.comments||[]).forEach(c=>lbl(c,'前'))}));
    ((P.mail&&P.mail.mails)||[]).forEach(m=>{if(isN(m.ago)){m.time=mailLbl(m.ago);const d=agoDate(m.ago);m._dt=shortD(ymd(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())}else m._dt=''});

    const B=P.bubble;if(B){if(isN(B.chatDayOff)){const d=new Date(NOW0.getTime()-B.chatDayOff*864e5);B.chatDate=(d.getMonth()+1)+'月'+d.getDate()+'日'}
      if(B.daysAuto&&!B.daysBase)B.daysBase=ymd(NOW0);if(!B.daysAuto)delete B.daysBase;

    const C=P.cal;if(C){if(isN(C.startOff)){const d=new Date(NOW0.getFullYear(),NOW0.getMonth()+C.startOff,1);C.start=d.getFullYear()+'-'+pad(d.getMonth()+1)}
      (C.events||[]).forEach(e=>{if(isN(e.off)){e.date=ymd(new Date(NOW0.getTime()+e.off*864e5))}})}
  }catch(e){console.warn('resolveTimes',e)}
}

/* call overlay */
const CO=$('#callov'),isl=$('#island');
const coCap=$('#coCap');
function setCall(name,state,lines,leave){
  call={name,state,lines:lines||[],leave:leave||'',idx:0,t0:0,miss:false};
  $('#coName').textContent=name;coCap.innerHTML='';CO.hidden=false;CO.classList.remove('out');CO.dataset.s=state;

/* 聯絡人：lock:"旗標"＝旗標達成前撥不出去；cases:[{wait:"旗標",lines:[...]}]＝依劇情進度換通話內容（由上往下取第一個符合的） */
function callLinesOf(c){if(!c)return[];const k=(c.cases||[]).find(x=>x&&flagOK(x.wait));return((k&&k.lines)||c.callLines||[]).filter(Boolean)}
function startCall(name){
  if(call)return;const c=contactBy(name);
  if(c&&c.lock&&!flagOK(c.lock))return;
  setCall(name,'dial',callLinesOf(c));
  clearTimeout(callTimer);
  callTimer=setTimeout(()=>{ if(!call)return; if(call.lines.length)connect(); else{$('#coSt').textContent='無人接聽';callTimer=setTimeout(()=>finishCall(false,true),1800)} },1800);
}
function connect(){
  call.state='in';call.t0=Date.now();$('#isCallT').textContent='00:00';CO.dataset.s='in';isl.classList.add('calling');isl.classList.remove('ringing');
  const tick=()=>{if(!call||call.state!=='in')return;const s=Math.floor((Date.now()-call.t0)/1000);const t=pad(Math.floor(s/60))+':'+pad(s%60);$('#coSt').textContent=t;$('#isCallT').textContent=t;callTimer=setTimeout(tick,500)};
  tick();
  const next=()=>{ if(!call||call.state!=='in')return;
    if(call.idx<call.lines.length){const d=document.createElement('div');d.className='co-line';d.textContent=call.lines[call.idx++];coCap.append(d);coCap.scrollTop=coCap.scrollHeight;call.lt=setTimeout(next,Math.max(1800,Math.min(4200,d.textContent.length*160)))}
    else call.lt=setTimeout(()=>{if(call&&call.state==='in'){const d=document.createElement('div');d.className='co-line end';d.textContent='（對方掛斷了）';coCap.append(d);setTimeout(()=>finishCall(false),1400)}},2200)};
  call.lt=setTimeout(next,900);
}
function finishCall(missed,silent){
  if(!call)return;const c=call;clearTimeout(callTimer);clearTimeout(c.lt);call=null;
  isl.classList.remove('calling','ringing');CO.classList.add('out');setTimeout(()=>{CO.hidden=true;CO.classList.remove('out')},260);
  const wasIn=c.state==='in',dir=c.state==='ring'?(missed?'missed':'missed'):(c.state==='dial'?'out':(c.t0&&c.fromRing?'in':'out'));
  const label=contactBy(c.name)?'手機':'';
  if(c.state==='ring'){
    P.calls.unshift({_rt:1,name:c.name,dir:'missed',t:'剛剛',label:'手機'});
    if(c.leave){let th=P.msgs.threads.find(t=>t.name===c.name);if(!th){th={name:c.name,open:true,msgs:[]};P.msgs.threads.unshift(th)}const n=new Date;th.msgs.push({from:'them',text:c.leave,date:ymd(n),time:pad(n.getHours())+':'+pad(n.getMinutes())});
      PH().voicemails=PH().voicemails||[];PH().voicemails.unshift({name:c.name,t:'剛剛',dur:'0:'+pad(8+c.leave.length%20),text:c.leave})}
  }else if(c.state==='in'){P.calls.unshift({_rt:1,name:c.name,dir:c.inbound?'in':'out',t:'剛剛',label:'手機'});if(c.idx>=c.lines.length)setFlag('call:'+c.name)}
  else if(!silent||true){P.calls.unshift({_rt:1,name:c.name,dir:'out',t:'剛剛',label:'手機'})}
  renderCalls($('#rSeg .on')&&$('#rSeg .on').dataset.rf==='missed');renderContacts();renderMsgs();
}

/* ================= KakaoTalk 劇本式打字＋劇情流程 =================
   r.script 每一步（依序進行）：
     {me:"玩家要打的字", then:[...]}   玩家步驟：要在聊天室裡按送出
     {then:[...], delay:秒}            自動步驟：不用玩家操作，訊息自己跳出來（不在聊天室會跳通知）
     wait:"旗標1,旗標2"                這些旗標全部達成才開始這一步（後面的步驟也會一起等）
     set:"旗標"                        這一步走完後設定旗標
   then 每一則：{text, who, delay, room（送到別的聊天室）, sys:true（系統提示）, recall:N（收回 who 最後 N 則）,
                 set, fx:"blackout"（黑屏＋lines:[{text,sub,hold,gap}]）| "toast"（text, sub）}
   r.lock:true／有劇本的聊天室：沒有輪到玩家時不能自由打字（lockHint＝輸入框提示字）；旗標 clear 達成後全部解鎖 */
const kScr={},kRun={};let kPend=null,kBusy=false,kTok=0,kCur=null,kArm=null,kEpoch=0,kQuiet=false;
const ZK='ㄅㄉㄓㄚㄞㄢㄆㄊㄍㄐㄔㄗㄧㄛㄟㄣㄇㄋㄎㄑㄕㄘㄨㄜㄠㄤㄈㄌㄏㄒㄖㄙㄩㄝㄡㄥ'.split('');
function kKeys(ch){
  if(ch===' ')return['space'];
  const c=ch.codePointAt(0);
  if(c>0xFFFF||(c>=0x2600&&c<=0x27BF))return['emoji'];
  if(c<0x4E00||c>0x9FFF)return[ZK[c%ZK.length]];
  const n=2+c%2,o=[];for(let i=0;i<n;i++)o.push(ZK[(c*(3+i*7)+i*11)%ZK.length]);return o;
}
function kPress(k){const e=document.querySelector('#kb [data-k="'+k+'"]');if(!e)return;e.classList.add('dn');setTimeout(()=>e.classList.remove('dn'),90)}
function kScript(i){const r=P.kakao.rooms[i];return r&&(r.script||[])[kScr[i]||0]}
function kReady(i){const sc=kScript(i);return sc&&(unlocked||(sc.pre&&!sc.me))&&!kRun[i]&&flagOK(sc.wait)?sc:null} /* pre:true＝自動步驟可以在解鎖前就開始（鎖定畫面會跳通知） */
function kInRoom(i){return curApp==='kakao'&&kRoomI===i&&$('#kRoom').classList.contains('open')}
function kLocked(r){if(!r||FL.has('clear'))return false;return !!(r.lock||(r.script&&r.script.length))}
function kLockUI(){if(kRoomI==null||kBusy||kPend||kArm!=null)return;const r=P.kakao.rooms[kRoomI],inp=$('#rText');if(!r)return;
  const lk=kLocked(r);inp.readOnly=lk;inp.placeholder=lk&&r.lockHint?r.lockHint:'輸入訊息'}
function kRoomEl(){return $('#kRoom')}
function kType(i,text){
  const inp=$('#rText'),tok=++kTok;kBusy=true;kPend=null;kArm=null;kCur={i,text};inp.value='';inp.readOnly=true;inp.placeholder='輸入訊息';
  const seq=[];Array.from(text).forEach(ch=>kKeys(ch).forEach((k,j,a)=>seq.push({k,ch:j===a.length-1?ch:''})));
  let n=0;
  const next=()=>{
    if(tok!==kTok)return;
    if(n<seq.length){const s=seq[n++];if(s.ch){inp.value+=s.ch;inp.dispatchEvent(new Event('input'))}
      setTimeout(next,s.ch?(s.ch===' '?90:120):0)}
    else{kBusy=false;kPend={i,text};inp.dispatchEvent(new Event('input'));$('#rSend').classList.add('send','pulse')}
  };
  setTimeout(next,500);
}
function kStart(i){
  kTok++;kPend=null;kBusy=false;kArm=null;const inp=$('#rText'),sc=kReady(i);
  if(!sc||!sc.me){kLockUI();kRoomEl().classList.remove('kbon');return}
  kArm=i;inp.readOnly=true;inp.placeholder='輸入訊息';const tok=kTok;
  setTimeout(()=>{if(tok!==kTok)return;kArm=null;if(kInRoom(i)&&kReady(i)===sc)kType(i,sc.me);else kLockUI()},650);
}
const kNow=()=>{const d=new Date;return{time:pad(d.getHours())+':'+pad(d.getMinutes()),date:ymd(d)}};
function kRoomIdx(name,fb){if(!name)return fb;const R=P.kakao.rooms;let j=R.findIndex(r=>r.name===name);
  if(j<0){R.push({_rt:1,name,group:false,members:0,pinned:false,unread:0,avatar:null,msgs:[]});j=R.length-1}return j}
function fxBlackout(lines){
  const S=$('#screen'),ov=document.createElement('div'),box=document.createElement('div'),mp=document.createElement('p'),sb=document.createElement('small');
  ov.className='fx-black';box.className='ln';box.append(mp,sb);ov.append(box);S.append(ov);
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('on')));
  let t=1600;
  /* vows:[...]＝這一句出現後，下面逐字打出幾行字（仿 ritopia 課後班彩蛋的打字節奏），打完再停 hold 秒 */
  /* cut:true＝這句直接搶話接上，上一句不淡出；vowSub＝誓詞打完後在最下面淡淡出現的一行 */
  lines.forEach((l,li)=>{const hold=(+l.hold||3.2)*1000,gap=(l.gap!=null?+l.gap:1.2)*1000,at=t,nextCut=!!(lines[li+1]&&lines[li+1].cut);
    const vows=Array.isArray(l.vows)?l.vows:[];
    setTimeout(()=>{if(l.cut){box.style.transition='none';requestAnimationFrame(()=>{box.style.transition=''})}mp.textContent=l.text||'';sb.textContent=l.sub||'';box.classList.toggle('big',!!vows.length);const ov0=box.querySelector('.vw');if(ov0)ov0.remove();box.classList.add('on')},at);
    let end=at;
    if(vows.length){const vw=document.createElement('div');vw.className='vw';let t2=at+1400;
      setTimeout(()=>box.append(vw),t2);
      vows.forEach(line=>{const pe=document.createElement('p');setTimeout(()=>vw.append(pe),t2);const ch=Array.from(line);
        ch.forEach((c,ci)=>{t2+=136+Math.random()*140;if(ci&&/[，。,.!?！？、]/.test(ch[ci-1]))t2+=360+Math.random()*320;if(Math.random()<0.16)t2+=300+Math.random()*450;
          const k=ci+1;setTimeout(()=>{pe.textContent=ch.slice(0,k).join('')},t2)});
        t2+=350});
      if(l.vowSub){const vs=document.createElement('small');vs.className='vs';vs.textContent=l.vowSub;setTimeout(()=>{vw.append(vs);requestAnimationFrame(()=>requestAnimationFrame(()=>vs.classList.add('on')))},t2+500);t2+=1500}
      end=t2}
    if(!nextCut)setTimeout(()=>box.classList.remove('on'),end+hold-650);t=end+hold+(nextCut?0:gap)});
  setTimeout(()=>ov.classList.remove('on'),t);setTimeout(()=>ov.remove(),t+1300);return t+1300}
function fxToast(text,sub){const d=document.createElement('div');d.className='fx-toast';d.innerHTML=`<b>${esc(text)}</b>${sub?`<span>${esc(sub)}</span>`:''}`;$('#screen').append(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));setTimeout(()=>d.classList.remove('on'),3800);setTimeout(()=>d.remove(),4500)}

    }else{
      p.append(el('div',{className:'note warn'},'目前是「預覽模式」：內容只存在這個瀏覽器裡。把整個資料夾放到 GitHub Pages 後，網址加上 <code>#edit</code> 才會自動存回 GitHub。'));
    }
    p.append(el('div',{className:'note'+(k>9000?' warn':'')},`目前資料量約 ${k>1024?(k/1024).toFixed(1)+' MB':k+' KB'}`));
    p.append(el('div',{className:'note'},'備份／換電腦：複製資料，之後貼回「載入資料」即可還原。也可以只貼某一個 App 的資料（例如只有 kakao 那一段），只會取代那一段，其他不動。'));
    const ta=el('textarea',{className:'imp',placeholder:'在這裡貼上之前複製的資料，再按「載入資料」'});
    p.append(addBtn('複製資料（JSON）',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(P,SAVE_RP))}catch(e){ta.value=JSON.stringify(P,SAVE_RP);ta.select()}}),ta,
      addBtn('載入資料（可只貼一部分）',()=>{try{const d=JSON.parse(ta.value);if(!d||typeof d!=='object'||Array.isArray(d))throw 0;const ks=Object.keys(d).filter(k=>k in EMB);if(!ks.length)throw 0;
        ks.forEach(k=>{if(k==='meta'&&P.meta&&typeof d.meta==='object')Object.assign(P.meta,d.meta);else P[k]=d[k]});P.meta.editable=true;save();renderAll();draw2();alert('已載入：'+ks.join('、'))}catch(e){alert('資料格式不對，無法載入')}}));
    if(!GH)p.append(addBtn('重設為範例',()=>{if(confirm('會清除目前所有內容，確定嗎？')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}));
  }
  function draw2(){
    E.innerHTML='';E.append(el('h2',null,'📱 手機編輯器'),el('div',{className:'sub'},'左邊手機會即時更新；'));
    const tabs=el('div',{className:'tabs'});TABS.forEach(([id,n])=>{const b=el('button',{textContent:n,className:tab===id?'on':'',type:'button'});b.onclick=()=>{tab=id;try{localStorage.setItem(KEY+'-tab',tab)}catch(e){}draw2()};tabs.append(b)});
    const pane=el('div',{className:'pane'});E.append(tabs,pane);TABS.find(t=>t[0]===tab)[2](pane);
  }
  draw2();
  const mb=el('button',{id:'modeBtn',textContent:'▶ 遊玩預覽',type:'button'});
  mb.onclick=()=>{const p=document.body.classList.toggle('play');mb.textContent=p?'✎ 回到編輯':'▶ 遊玩預覽';mb.style.display='block';setTimeout(scaleIt,50);relock()};
  document.body.append(mb);
  const sk=el('button',{id:'skipBtn',textContent:'⏭ 從通關開始',type:'button'});
  sk.onclick=()=>{if(confirm('直接跳到通關後的狀態？（只影響這次預覽，不會存進資料）'))window.__storySkip()};
  document.body.append(sk);
})();
})();
</script>
